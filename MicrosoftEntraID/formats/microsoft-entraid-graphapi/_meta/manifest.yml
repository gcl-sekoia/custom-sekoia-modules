name: GraphAPI for Microsoft Entra ID / Azure AD (GCL)
slug: graphapi-for-microsoft-entra-id-azure-ad-gcl

description: >-
  Microsoft Entra ID, formerly known as Azure Active Directory (Azure AD), is an identity and access management solution from Microsoft that helps organizations secure and manage identities in cloud and on-premises environments.
  This integration will collect the events through Microsoft Graph API, which is only recommended for small environments. For larger environments, it is recommended to use the Microsoft Entra ID / Azure AD integration.

